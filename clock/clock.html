<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clock NFT</title>
  <style>
    body {
      background: #000; /* Set background to black */
      margin: 0; /* Remove default margin */
      height: 100vh; /* Fill viewport height */
      display: flex; /* Use Flexbox for centering */
      justify-content: center; /* Center horizontally */
      align-items: center; /* Center vertically */
    }
  </style>
</head>
<body>
  <div id="svg-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
  <script>
    const providerUrl = "https://mainnet.infura.io/v3/47db9235678945eb8d988b2a71d6e90e";
    const jwtToken = null;

    const fetchOptions = jwtToken ? {
      headers: {
        "Authorization": `Bearer ${jwtToken}`
      }
    } : {};

    const provider = new ethers.JsonRpcProvider(providerUrl, undefined, { fetchOptions });

    const contractAddress = "0xDa22422592Ee3623c8d3c40Fe0059CdEcF30CA79";
    const abi = ["function tokenURI(uint256 tokenId) view returns (string)"];

    const contract = new ethers.Contract(contractAddress, abi, provider);

    async function displayNFT() {
      try {
        const uri = await contract.tokenURI(1);
        console.log("Raw tokenURI:", uri);

        const jsonStart = uri.indexOf('data:application/json;utf8,') + 'data:application/json;utf8,'.length;
        const jsonData = uri.substring(jsonStart);
        console.log("Raw JSON:", jsonData);

        const metadata = JSON.parse(jsonData.replace(/"$/, ''));
        console.log("Parsed Metadata:", metadata);

        let svgData = metadata.image.replace('data:image/svg+xml;utf8,', '');
        console.log("Extracted SVG data:", svgData);

        // Render the SVG without any modifications
        const svgContainer = document.getElementById("svg-container");
        svgContainer.innerHTML = svgData;

        // Log to confirm rendering
        console.log("SVG rendered:", svgContainer.innerHTML);
      } catch (e) {
        console.error("Error fetching or displaying NFT image:", e);
        console.error("Error details:", e.message, e.reason, e.code);
        document.getElementById("svg-container").innerHTML = `<p>Error loading SVG: ${e.message}</p>`;
      }
    }

    displayNFT();
  </script>
</body>
</html>
